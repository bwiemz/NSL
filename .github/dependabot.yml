# Dependabot — dependency freshness for the workspace and its CI actions.
#
# Rust updates are GROUPED into one weekly PR per update class so the lockfile
# does not spray dozens of single-crate PRs. Major bumps of the crates the
# compiler is welded to (cranelift-*, cudarc, tokenizers) are deliberately
# excluded here: each of those is a migration with its own snapshot baselines
# (roadmap D2 for Cranelift), not a dependency bump.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]
      rust-major:
        update-types: ["major"]
    ignore:
      - dependency-name: "cranelift-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "cudarc"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ort"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # hf-hub 1.0 is an async rewrite (reqwest + tokio, +114 crates incl.
      # aws-lc-sys/cmake) with no `api::sync` module; the runtime's one call
      # site stays on 0.4 with the `ureq` backend. A 1.0 migration is a
      # decision, not a bump (why Dependabot's #558 was superseded by hand).
      - dependency-name: "hf-hub"
        update-types: ["version-update:semver-major"]
      # object must track what cranelift-object pins (^0.39 at 0.135); it
      # moves with the D2 Cranelift migrations, not on its own.
      - dependency-name: "object"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
