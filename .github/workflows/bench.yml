# CPU benchmark lane (roadmap T3): scripts/bench.sh on a hosted runner,
# base commit vs. head, verdicts to the job summary.
#
# INFORMATIONAL, NOT A GATE. Two reasons it cannot be one:
#   - a hosted runner's neighbours are unknown; on this project's own
#     workstation the same commit measured +8% ("Performance has regressed")
#     on lex/largest_file between two full 100-sample runs while a training
#     job shared the box. Both halves of the comparison run on the SAME
#     runner in the SAME job, back to back, which removes the runner-to-runner
#     variance but not the moment-to-moment kind;
#   - criterion's verdict is a statistical one (p < 0.05 AND the whole
#     confidence interval past the noise threshold); a true 3% regression
#     reads "within noise" at the 5% threshold this lane uses.
# So the compare step is `continue-on-error`, the workflow is not a required
# check, and a "regressed" verdict is a prompt to reproduce locally
# (`scripts/bench.sh save main` on main, `compare main` on the branch), not a
# finding. The audit asked for a PR comment on >5% regressions; a comment
# needs `pull-requests: write` on a workflow that runs pull_request events
# from forks of a PUBLIC repo, and the step summary carries the same table
# with `contents: read` only.
#
# Triggers: manual (`workflow_dispatch`, pick a base ref), or a pull request
# carrying the `bench` label — every push to a labelled PR re-runs it. A
# push to main is deliberately NOT a trigger: a self-compare of main against
# main is a noise-floor measurement, which is what the dispatch form gives
# you on demand without spending ~15 min of runner per merge.
#
# Runs ONLY on ubuntu-latest. Never point this at the self-hosted GPU runner:
# that runner accepts `schedule`/`workflow_dispatch` alone (see gpu-cert.yml)
# because this repository is public and pull_request runs execute the PR's
# code.

name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to compare against (default: merge-base with origin/main)"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: no debuginfo, no incremental. The bench profile inherits
  # release, which carries no debuginfo already; the dev-profile settings keep
  # the build scripts and proc-macros small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  bench:
    name: base vs head (informational)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be checkable-out, and merge-base needs
          # history on both sides.
          fetch-depth: 0

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate key from ci.yml's: this target dir holds release-profile
          # bench artifacts, not the test tree.
          key: ${{ runner.os }}-cargo-bench-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve base and head
        id: refs
        # Event data goes through env, not `${{ }}` inside `run`: the
        # dispatch input is free text and the PR base ref is a branch name,
        # and either interpolated into the script would be executed as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_INPUT: ${{ github.event.inputs.base }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # actions/checkout gives a pull_request run the PR merged onto its
            # base branch, so the merge-base with that branch is the branch's
            # tip and head-minus-base is exactly the PR's delta.
            git fetch --no-tags origin "${PR_BASE_REF}"
            base="$(git merge-base "${head}" "origin/${PR_BASE_REF}")"
          elif [ -n "${BASE_INPUT}" ]; then
            git fetch --no-tags origin "${BASE_INPUT}" || true
            base="$(git rev-parse --verify "${BASE_INPUT}^{commit}" \
                    || git rev-parse --verify "origin/${BASE_INPUT}^{commit}")"
          else
            git fetch --no-tags origin main
            base="$(git merge-base "${head}" origin/main)"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "base ${base}"
          echo "head ${head}"
          if [ "${base}" = "${head}" ]; then
            echo "base == head: this run measures the noise floor, every verdict below is noise"
          fi

      # The base's benches are the base's own: a bench added by the PR has no
      # baseline and is reported as new (--baseline-lenient below), and a
      # bench the PR removed is not run at all. A base that fails to build or
      # bench (the PR may be the fix) is not fatal either: the head still runs,
      # compared against whatever the base did save, and the base log lands in
      # the summary.
      #
      # The cache restores target/ — criterion's results with it — from
      # whichever run first wrote this Cargo.lock key, and an exact hit is never
      # re-saved, so without the rm a head run would compare against that
      # run's base, a different commit.
      - name: Save baseline at base
        id: save
        continue-on-error: true
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          rm -rf target/criterion
          git checkout --quiet --detach "${BASE}"
          if [ ! -x scripts/bench.sh ]; then
            echo "scripts/bench.sh does not exist at the base commit; nothing to compare against" >&2
            exit 0
          fi
          scripts/bench.sh save base -- --noplot 2>&1 | tee bench-base.txt

      # Lenient: a bench with no `base` baseline (added by this PR, or the base
      # never saved one) is reported without a change line instead of failing
      # the run. 5% is the audit's "worth a look" threshold — below it
      # criterion says "within noise threshold" whatever the p-value.
      - name: Compare at head
        id: compare
        continue-on-error: true
        env:
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "${HEAD}"
          scripts/bench.sh -- --noplot --baseline-lenient base --noise-threshold 0.05 2>&1 | tee bench-head.txt

      - name: Summary
        if: always()
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Benchmarks: \`${BASE}\` (base) vs \`${HEAD}\` (head)"
            echo
            echo "Informational only — see the header of \`.github/workflows/bench.yml\`."
            echo
            if [ "${SAVE_OUTCOME}" != "success" ]; then
              echo "**The base commit did not bench to completion** (step outcome: ${SAVE_OUTCOME}); a head bench with no verdict below had no baseline to compare against."
              if [ -s bench-base.txt ]; then
                echo
                echo "<details><summary>base log (tail)</summary>"
                echo
                echo '```'
                tail -n 40 bench-base.txt
                echo '```'
                echo "</details>"
              fi
              echo
            fi
            if [ ! -s bench-head.txt ]; then
              echo "No results: the compare step did not produce output (see its log)."
            else
              # Criterion prints the bench name at column 0 and everything
              # about it indented on the following lines; the verdict line is
              # one of those. Pair each verdict with the last name seen.
              echo "| bench | verdict |"
              echo "|---|---|"
              awk '
                /^[^ \t]/ { name = $1 }
                /Performance has regressed/  { n++; printf "| `%s` | **regressed** |\n", name }
                /Performance has improved/   { n++; printf "| `%s` | improved |\n", name }
                /within noise threshold/     { n++; printf "| `%s` | within noise |\n", name }
                /No change in performance/   { n++; printf "| `%s` | no change |\n", name }
                END { if (!n) print "| (none) | no bench had a baseline to compare against |" }
              ' bench-head.txt
              echo
              echo "<details><summary>criterion output (head)</summary>"
              echo
              echo '```'
              grep -v '^Benchmarking' bench-head.txt || true
              echo '```'
              echo "</details>"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${COMPARE_OUTCOME}" != "success" ]; then
            echo "compare step outcome: ${COMPARE_OUTCOME} (non-blocking)"
          fi
