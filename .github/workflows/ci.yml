name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

  # ── Why this workspace does not fit on a hosted runner by default ────────
  #
  # `cargo test --workspace` builds ~576 test executables, and each one
  # statically links the whole workspace. With the default dev/test profile
  # (debug = full) that tree measured 59 GB locally, of which 51 GB is
  # `debug/deps` and 7.3 GB is `debug/incremental`. A hosted ubuntu runner has
  # roughly 14 GB free. The result was not a slow lane, it was a WRONG one:
  # the run died mid-suite with
  #
  #     ##[warning]You are running out of disk space. Free space left: 86 MB
  #     /usr/bin/ld: final link failed: No space left on device
  #
  # and the tests whose fixtures link a program (ccr_periodic_stride_gate,
  # awq_full_pipeline, …) reported as FAILED. Every recent PR carried that red,
  # which is worse than a broken lane — it is a lane nobody can read, so a real
  # regression and an out-of-disk look identical.
  #
  # Debuginfo is the whole difference and CI never opens a debugger. Measured
  # on this workspace, same command, two clean target dirs:
  #
  #     cargo test --workspace --no-run                     50 GB
  #     + CARGO_INCREMENTAL/DEV_DEBUG/TEST_DEBUG = 0        3.1 GB
  #
  # 16x, and 3.1 GB fits a hosted runner with room for the run itself.
  # Backtraces keep their frames; only file/line goes.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # macOS ARM64 PIE text-relocation issue is addressed by the Cranelift
          # is_pic fix in binary_codegen.rs (this PR).  A follow-up CI run will
          # verify the fix and graduate macOS to required once all tests pass.
          - os: macos-14
            optional: true
          - os: macos-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the same version as rust-toolchain.toml so that clippy is
          # installed for the exact toolchain the workspace uses. The prior
          # approach (install stable, then `rustup component add clippy
          # --toolchain 1.95.0`) fails on macOS runners when the component
          # manifest doesn't expose a standalone clippy binary for 1.95.0 on
          # that host triple. Using the `toolchain` input lets dtolnay/rust-
          # toolchain resolve and install clippy correctly on all platforms.
          toolchain: 1.95.0
          components: clippy

      # Reclaim the preinstalled toolchains this repo never uses. Worth ~25 GB
      # on ubuntu — headroom for the ~128 MB binaries the NSL fixtures link
      # into TMPDIR during the run, which the cargo profile settings above do
      # not shrink.
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          echo "after:"; df -h / | tail -1

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `v2` is load-bearing, not decoration. The v1 caches hold a ~10 GB
          # full-debuginfo `target/` built under the old profile: restoring one
          # spends 2.5 min untarring 10 GB onto a 14 GB disk, and cargo then
          # rebuilds anyway because the profile fingerprint changed. Bumping
          # the key starts cold once and saves a small cache from then on.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      # --no-fail-fast: without it, `cargo test` stops at the FIRST failing test
      # binary and never builds/runs the rest, so a red run reports exactly one
      # broken target no matter how many are broken. That turned the four
      # independent windows-latest failures of PR #455 into four serial ~25 min
      # CI round-trips (one bug surfaced per run). A green run is unaffected —
      # nothing aborts early, so there is nothing to skip — and the job still
      # exits non-zero if any target fails. Only RED runs pay: they now run to
      # completion rather than aborting, which is the intended trade.
      - name: Unit tests
        run: cargo test --workspace --no-fail-fast -- --skip e2e_

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: E2E smoke tests (Linux/Windows)
        if: runner.os != 'macOS'
        run: cargo test -p nsl-cli --test e2e -- --test-threads=1

      # D3 (ZeRO-1): the multi-rank SPMD parity gate is #[ignore]d (spawns
      # processes) so `cargo test` skips it — run it explicitly. It is the
      # only executable proof of deadlock-free lockstep, owner gating, the
      # collective counts, and the --devices argv forwarding. Each SPMD
      # invocation carries a 900 s watchdog, so a hung rank turns red, not
      # into a hung job (Linux/Windows only — the macOS lane is non-blocking
      # elsewhere and process spawning is slowest there).
      - name: ZeRO SPMD parity gate (Linux/Windows)
        if: runner.os != 'macOS'
        run: cargo test -p nsl-cli --test zero_spmd_gate -- --include-ignored --test-threads=1

      - name: E2E smoke tests (macOS, non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: cargo test -p nsl-cli --test e2e -- --test-threads=1

  # M62b Spec C — ONNX Runtime custom op integration tests.
  # Always runs on PRs and pushes to main. The job is cheap (~5 min) and
  # the Rust-side gated tests don't require an ORT install; only the Python
  # E2E step does. Spec §3.4 (separate CI job; default loop stays ORT-free)
  # is honored because the steps that touch ORT runtime are isolated here —
  # the main `build-and-test` job above does NOT compile the onnx-rt-op
  # feature.
  test-onnx-rt:
    name: M62b Spec C — ONNX RT integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          # rustfmt is required by `bindgen` in tools/verify-ort-vendoring.sh:
          # bindgen shells out to rustfmt to format generated bindings, and the
          # pinned 1.95.0 toolchain does not ship it by default.
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-onnxrt-${{ hashFiles('**/Cargo.lock') }}

      - name: Install bindgen-cli
        run: cargo install bindgen-cli --locked

      - name: Install ONNX Runtime 1.22.0
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz
          tar -xzf onnxruntime-linux-x64-1.22.0.tgz
          echo "$PWD/onnxruntime-linux-x64-1.22.0/lib" >> $GITHUB_PATH
          echo "ORT_HOME=$PWD/onnxruntime-linux-x64-1.22.0" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.22.0/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      - name: Verify vendoring matches upstream
        run: bash tools/verify-ort-vendoring.sh

      - name: Build with onnx-rt-op feature
        run: cargo build --workspace --features onnx-rt-op

      - name: Cargo test (onnx-rt-op feature)
        # Only run the Spec C integration tests; the rest of the workspace
        # is already covered by `build-and-test` above without the feature.
        run: |
          cargo test -p nsl-runtime --features onnx-rt-op \
            --test onnx_rt_compute_bridge \
            --test onnx_rt_register_custom_ops

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps for E2E
        run: pip install onnxruntime==1.22.0 onnx pytest numpy

      - name: Build nsl-cli with onnx-rt-op
        run: cargo build -p nsl-cli --features onnx-rt-op

      - name: Python E2E (gated)
        env:
          NSL_TEST_ONNX_RT: "1"
          NSL_BIN: ${{ github.workspace }}/target/debug/nsl
        working-directory: python
        run: python -m pytest tests/test_m62_onnx_op.py -v

  # Item 7 — host interop ownership. The completion criterion ("NslModel.forward
  # returns OWNED PyTorch tensors") is a Python-observable property, so it needs
  # a lane with torch installed: the Rust gates cover the C ABI, but only this
  # one exercises torch.utils.dlpack consuming an NSL-allocated output, the
  # capsule pointer ABI, and outputs outliving model.close(). Without it the
  # item's own acceptance test never runs anywhere.
  python-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps (CPU torch)
        run: |
          pip install pytest numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build nsl-cli
        # The suite compiles real @export shared libraries via this binary.
        run: cargo build -p nsl-cli

      - name: Python interop tests
        working-directory: python
        run: python -m pytest tests/ -v

  # M57 FPGA/Neuromorphic — Verilator + Yosys gate (from origin/main PR #193).
  fpga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install Verilator + Yosys
        run: sudo apt-get update && sudo apt-get install -y verilator yosys

      - name: Record tool versions (provenance per §5.4)
        run: |
          echo "Ubuntu: $(lsb_release -ds)"
          verilator --version
          yosys -V

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-fpga-${{ hashFiles('**/Cargo.lock') }}

      - name: Build NSL codegen
        run: cargo build -p nsl-codegen --release

      - name: Run Layer 1 snapshot tests
        run: cargo test -p nsl-codegen --test verilog_emission_snapshots --test hir_pass_snapshots

      - name: Run Layer 3 Yosys gate
        run: cargo test -p nsl-codegen --test yosys_gate

      - name: Fixture determinism check
        run: |
          cp crates/nsl-test/fixtures/mlp_int8_weights_v1.bin /tmp/committed.bin
          cargo run -p nsl-test --bin generate_mlp_int8_weights_v1
          cmp --silent /tmp/committed.bin crates/nsl-test/fixtures/mlp_int8_weights_v1.bin \
            || (echo "ERROR: regenerated fixture differs from committed fixture" && exit 1)

      - name: Run nsl-test lib unit tests
        run: cargo test -p nsl-test --lib

  # The `cuda` feature gates the entire crates/nsl-runtime/src/cuda module. No
  # other job builds it, so until this existed that code -- roughly 25 tests, 59
  # hand-written PTX modules, and the GPU caching allocator -- was never even
  # compiled in CI. Three latent bugs lived there for months as a result.
  #
  # No GPU is required. The CUDA toolkit supplies ptxas (which assembles PTX
  # without a device) and a libcuda stub to link against. The tests selected
  # below deliberately touch no CUDA API: the allocator tests drive a mock
  # driver, and the PTX gate only shells out to ptxas.
  cuda-feature:
    name: CUDA feature — compile + GPU-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install CUDA toolkit (nvcc, ptxas, cudart stubs, cuBLAS)
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          # Must be >= 13.2. cuda/mod.rs constructs a CUmemLocation with the
          # `__bindgen_anon_1` field, and cudarc only emits
          # `CUmemLocation_st__bindgen_ty_1` under its cuda-13020 / cuda-13030
          # features. Building against 12.x fails with E0560 / E0422.
          #
          # cudarc's `cuda-version-from-build-system` feature also shells out to
          # `nvcc --version`, so nvcc must be present even though nothing here
          # compiles CUDA C.
          cuda: '13.2.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cuda-${{ hashFiles('**/Cargo.lock') }}

      - name: Show toolkit
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          nvcc --version
          ptxas --version
          echo "--- libcuda stubs ---"
          find "$CUDA_PATH" -name 'libcuda.so*' -o -name 'libcublas.so*' | head

      # cudarc links -lcuda and -lcublas. On a driverless runner libcuda.so comes
      # from the toolkit's stubs directory; cudarc's build script already adds
      # lib64/stubs to the rustc link search path, but the linker and the loader
      # each need it too.
      - name: Export stub library paths
        run: |
          # CUDA 12 puts stubs in lib64/stubs; CUDA 13 uses
          # targets/x86_64-linux/lib/stubs. Export both so this survives a bump.
          STUBS="$CUDA_PATH/lib64/stubs:$CUDA_PATH/targets/x86_64-linux/lib/stubs"
          LIBS="$CUDA_PATH/lib64:$CUDA_PATH/targets/x86_64-linux/lib"
          echo "LIBRARY_PATH=$STUBS:$LIBS:${LIBRARY_PATH:-}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$STUBS:$LIBS:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV

      # Linking finds `libcuda.so` in the stubs directory, but at run time the
      # loader resolves the SONAME `libcuda.so.1`, which the toolkit does not
      # ship. Nothing in this job calls into the driver -- the allocator tests
      # drive a mock and the PTX gate only shells out to ptxas -- so the stub is
      # sufficient. It just has to exist under the name the loader looks for.
      - name: Expose libcuda.so.1 to the loader
        run: |
          STUB=$(find "$CUDA_PATH" -path '*stubs*' -name 'libcuda.so' | head -1)
          if [ -z "$STUB" ]; then echo "::error::no libcuda.so stub in $CUDA_PATH"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/cuda-stubs"
          ln -sf "$STUB" "$RUNNER_TEMP/cuda-stubs/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-stubs:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "linked $STUB -> $RUNNER_TEMP/cuda-stubs/libcuda.so.1"

      # Compile-coverage for the whole feature. This alone catches any change
      # that breaks the cuda module, which nothing else in CI does.
      - name: Build workspace with --features cuda
        run: cargo build --workspace --features cuda

      # Assembles all 59 hand-written PTX modules with ptxas. Needs no GPU.
      # Would have caught the invalid `.reg .f32 %f<3>` in BIAS_ADD_F32_PTX.
      - name: PTX assembly gate
        run: |
          cargo test -p nsl-runtime --features cuda --lib -- \
            --exact cuda::tests::all_handwritten_ptx_assembles_with_ptxas --nocapture

      # Pure logic over a mock driver; no CUDA calls. Would have caught the
      # small-pool free-list bug.
      - name: GPU caching allocator tests
        run: cargo test -p nsl-runtime --features cuda --lib -- cuda::caching_allocator

      # These live in nsl-codegen and need only ptxas, not the cuda feature.
      # They silently no-op on a runner without a toolkit, which is exactly how
      # the NUL-terminator bug survived.
      - name: PTX emitter ptxas validation
        run: |
          cargo test -p nsl-codegen --test csha_ptx_ptxas_validation
          cargo test -p nsl-codegen --test fused_linear_ce_bf16_ptxas
          cargo test -p nsl-codegen --test fused_linear_ce_fp16_ptxas
          cargo test -p nsl-codegen --test fused_linear_ce_large_vocab_ptxas
          # M35.1: the BitNet forward emitter shipped producing PTX that ptxas
          # rejected at essentially every instruction, while its structural
          # snapshot tests stayed green. This is the gate that catches that.
          cargo test -p nsl-codegen --test bitnet_gpu_correctness

      # Guard the blind spot itself: assert ptxas was actually found, so these
      # gates can never silently degrade to no-ops on a misconfigured runner.
      - name: Assert the ptxas gates did not skip
        run: |
          out=$(cargo test -p nsl-codegen --test fused_linear_ce_bf16_ptxas -- --nocapture 2>&1)
          echo "$out" | grep -q "ptxas accepted" \
            || (echo "::error::ptxas gate skipped -- toolkit not visible to the tests" && exit 1)
          bn=$(cargo test -p nsl-codegen --test bitnet_gpu_correctness -- --nocapture 2>&1)
          echo "$bn" | grep -q "ptxas OK" \
            || (echo "::error::BitNet ptxas gate skipped -- toolkit not visible to the tests" && exit 1)

  # Cheap, build-free gate: the version string lives in root Cargo.toml
  # ([workspace.package].version); every hand-duplicated copy (spec header,
  # README install snippet) must agree, and the CLI crate must inherit rather
  # than hardcode. Catches the "bumped Cargo but left the spec/README stale"
  # drift called out in the metadata-cleanup pass.
  version-agreement:
    name: Version agreement (Cargo == spec / README / CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version strings agree with Cargo [workspace.package].version
        run: ./scripts/check-version-agreement.sh

      # Every script a workflow invokes as `./path` must be committed
      # executable, or the step dies with exit 126 ("found but not
      # executable"). That failure reads like a broken check rather than a
      # broken mode bit, and it is invisible locally because a fresh chmod in
      # a dev tree is not what CI clones.
      #
      # This is not hypothetical: check-doc-agreement.sh and gpu-cert.sh both
      # shipped 100644 and every PR went red on them. Worse, gpu-cert.sh never
      # ran, so a REAL manifest drift (a gate added by the AdamW
      # parameter-groups PR) sat undetected behind the 126 until the mode was
      # fixed. A silently-not-running check is worse than no check.
      - name: Workflow-invoked scripts are committed executable
        run: |
          set -euo pipefail
          bad=0
          # Collect dot-slash script invocations from every workflow, then ask
          # git (not the filesystem) for the committed mode.
          #
          # YAML comment lines are dropped first: prose that names a script
          # path is not an invocation, and without this the step's own
          # explanatory comments match themselves.
          for s in $(grep -rhv -E '^[[:space:]]*#' .github/workflows/ \
                     | grep -oE '\./[A-Za-z0-9_./-]+\.(sh|py|pl)' | sort -u); do
            f="${s#./}"
            [ -f "${f}" ] || { echo "workflow invokes ${f}, which does not exist" >&2; bad=1; continue; }
            mode="$(git ls-files -s -- "${f}" | awk '{print $1}')"
            if [ "${mode}" != "100755" ]; then
              echo "${f} is committed ${mode}, must be 100755 (invoked as ${s})" >&2
              bad=1
            fi
          done
          [ "${bad}" -eq 0 ] || {
            echo "fix with: git update-index --chmod=+x <file>" >&2
            exit 1
          }
          echo "all workflow-invoked scripts are executable"

  # Documentation agreement — the twin of version-agreement, for claims about
  # the CODE rather than about version strings. Build-free, so it costs
  # seconds. Every check exists because the corresponding drift was found in
  # the tree: a wiki page asserting CCR had no implementation while ccr.rs was
  # 2027 lines and wired in; a README claiming all benchmarks were CPU while
  # models/benchmarks/ held RTX 5070 Ti curves; a CI job described as existing
  # "only during PR 3's review window" still present 12 weeks later.
  doc-agreement:
    name: Documentation agreement (docs == tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation claims agree with the repository
        run: ./scripts/check-doc-agreement.sh

  # ── GPU gate inventory (roadmap item 19) ────────────────────────────────
  #
  # This repository carries ~295 #[ignore] tests, of which ~255 need a CUDA
  # device. No hosted runner has a GPU, so CI cannot EXECUTE them — the
  # "CUDA feature" job above links cudart stubs and runs a ptxas syntax check
  # only. What CI can do is prove the inventory of gates still matches the
  # source, so a gate cannot be renamed, deleted, or silently un-#[ignore]d
  # without the manifest changing in the same commit.
  #
  # Execution happens on hardware via `scripts/gpu-cert.sh --run`. This job is
  # the drift half; it needs no toolchain and finishes in seconds.
  gpu-gate-inventory:
    name: GPU gate inventory (manifest == tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the GPU gate manifest agrees with the source
        run: ./scripts/gpu-cert.sh --check-inventory
      - name: "Check every #[ignore] carries a reason"
        # The reason string is the classifier's INPUT: it decides whether the
        # cert lane runs the test, quarantines it, or refuses it as a fixture
        # writer. A bare #[ignore] is a gate whose behaviour was guessed from
        # its file name — and eight of the last 67 guesses ran timing probes as
        # certification gates. Refuse the guess at the PR.
        run: ./scripts/gpu-cert.sh --check-reasons
      - name: Check the long-arm timeout overrides still resolve
        # ci/gpu-cert-long-arms.txt raises the per-target budget for the
        # full-training gates. It is keyed by source path, so a test-file
        # rename would silently drop the override and send those gates back to
        # reporting TIMEOUT — with nothing pointing at the cause. This makes
        # the rename fail here instead, on the GPU-free lane.
        run: ./scripts/gpu-cert.sh --check-long-arms
      - name: Manifest holds a plausible number of gates
        run: |
          set -euo pipefail
          # A floor, so a scanner that silently degrades to near-zero rows
          # cannot be blessed by re-running --write-manifest.
          n="$(grep -cv '^#' ci/gpu-cert-manifest.tsv)"
          echo "manifest gates: ${n}"
          [ "${n}" -ge 250 ] || { echo "manifest collapsed to ${n} gates" >&2; exit 1; }

      - name: Prove the drift check is not vacuous
        run: |
          set -euo pipefail
          # Delete one gate's #[ignore] and require a non-zero exit. Without
          # this, a manifest/scanner mismatch that made inventory() return
          # nothing would pass silently forever.
          victim="crates/nsl-cli/tests/fn_lifetime_leak_gate.rs"
          cp "${victim}" /tmp/victim.bak
          # Restore on EVERY exit path, including a failure between here and
          # the end of the step.
          trap 'cp /tmp/victim.bak "${victim}"' EXIT
          perl -0pi -e 's/#\[ignore = "requires CUDA GPU"\]\n//' "${victim}"
          # Assert the edit LANDED. If the reason string is ever reworded, perl
          # no-ops, --check-inventory stays green, and the failure below would
          # blame vacuity instead of a stale pattern.
          if git diff --quiet -- "${victim}"; then
            echo "victim pattern no longer matches — update this step" >&2
            exit 1
          fi
          if ./scripts/gpu-cert.sh --check-inventory > /dev/null 2>&1; then
            echo "ANTI-VACUITY FAILURE: removing gates left --check-inventory green" >&2
            exit 1
          fi
          echo "drift check correctly rejects a removed gate"

      - name: Prove the reason check is not vacuous
        run: |
          set -euo pipefail
          # Strip one gate's reason down to a bare #[ignore] and require
          # --check-reasons to fail. Same posture as the step above: a scanner
          # that stopped emitting the gpu-inferred/unclassified labels would
          # otherwise turn this check into a permanent green.
          victim="crates/nsl-cli/tests/fn_lifetime_leak_gate.rs"
          cp "${victim}" /tmp/victim-reason.bak
          trap 'cp /tmp/victim-reason.bak "${victim}"' EXIT
          perl -0pi -e 's/#\[ignore = "requires CUDA GPU"\]/#[ignore]/' "${victim}"
          if git diff --quiet -- "${victim}"; then
            echo "victim pattern no longer matches — update this step" >&2
            exit 1
          fi
          if ./scripts/gpu-cert.sh --check-reasons > /dev/null 2>&1; then
            echo "ANTI-VACUITY FAILURE: a bare #[ignore] left --check-reasons green" >&2
            exit 1
          fi
          echo "reason check correctly rejects a bare #[ignore]"
