name: Supply chain

# Dependency policy checks (deny.toml): advisories, licenses, duplicate
# versions, and dependency sources.
#
# - On a PR, runs only when the dependency graph could have changed.
# - Nightly, runs unconditionally: the RustSec advisory database moves even
#   when Cargo.lock does not, and an advisory published against a crate we
#   already pin must surface without waiting for the next manifest edit.
#
# Hosted runners only — this never touches the GPU lane.

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/supply-chain.yml'
  schedule:
    # 04:17 UTC daily — off the hour so it does not queue behind every other
    # project's midnight cron.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split so a new advisory (nightly noise we must act on) is reported
        # separately from a policy regression introduced by a PR.
        check: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check ${{ matrix.check }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}
          log-level: warn
