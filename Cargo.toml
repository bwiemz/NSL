[workspace]
resolver = "2"
members = [
    "crates/nsl-errors",
    "crates/nsl-lexer",
    "crates/nsl-ast",
    "crates/nsl-parser",
    "crates/nsl-semantic",
    "crates/nsl-codegen",
    "crates/nsl-runtime",
    "crates/nsl-cli",
    "crates/nsl-test",
    "crates/nsl-abi",
    "crates/nsl-env",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
# The workspace crates are a toolchain, not a library set: path dependencies
# carry no version, so none of them can be published as they stand.
publish = false
license = "Apache-2.0"
authors = ["Brandon Wiemer"]
repository = "https://github.com/bwiemz/NSL"
homepage = "https://github.com/bwiemz/NSL"

[workspace.dependencies]
nsl-errors = { path = "crates/nsl-errors" }
nsl-lexer = { path = "crates/nsl-lexer" }
nsl-ast = { path = "crates/nsl-ast" }
nsl-parser = { path = "crates/nsl-parser" }
nsl-semantic = { path = "crates/nsl-semantic" }
nsl-codegen = { path = "crates/nsl-codegen" }
nsl-env = { path = "crates/nsl-env" }

codespan-reporting = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
string-interner = "0.17"

cranelift-codegen = "0.125"
cranelift-frontend = "0.125"
cranelift-module = "0.125"
cranelift-object = "0.125"
cranelift-native = "0.125"
rand = "0.9"
rand_chacha = "0.9"
toml = "0.8"
bytemuck = { version = "1", features = ["derive"] }
# Benchmark harness (roadmap T3). Default features are off: `rayon` and
# `plotters` (gnuplot-style HTML plots) are dead weight for a compare-against-
# baseline workflow, and each one is a dependency tree the supply-chain gate
# would have to vet for nothing. `cargo_bench_support` is the `cargo bench`
# CLI (`--save-baseline`, `--baseline`, filters).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# ── Workspace lints ───────────────────────────────────────────────────────────
#
# Every crate opts in with `[lints] workspace = true`. A level set here
# reaches rustc as a `-D`/`-W` flag, so an in-source `#![allow]` still wins
# over it — the table is the floor, not a ceiling. CI runs clippy with
# `-D warnings` on the default features (every OS) and on the benches, so
# anything set to `warn` here is a hard error on those lanes; the cuda lane
# is a plain `cargo build --features cuda`, which only `deny` can break.
# Only add a lint once every target it reaches is clean under
# `cargo check --workspace --all-targets --all-features`.
[workspace.lints.rust]
# Inside an `unsafe fn`, each unsafe operation must sit in its own
# `unsafe {}` block instead of borrowing the signature's blanket. That
# makes the raw-pointer dereferences, FFI calls and `from_raw_parts`
# reconstructions in the runtime visible one by one (roadmap C6). Edition
# 2024 turns this lint on by default (at `warn`); taking it early, at
# `deny`, means the edition bump (roadmap D4) will not have to wrap them
# all at once.
unsafe_op_in_unsafe_fn = "deny"

# ── Build profiles ────────────────────────────────────────────────────────────
#
# Measured on the 9800X3D box, clean builds of `nsl` with `--features cuda`
# (2026-09-01, campaign record in the PR that added this block):
#
#   profile                 clean build   `nsl build hello`   nsl / libnsl_runtime.a
#   release (defaults)          43 s          0.267 s            22.9 MB / 64 MB
#   + lto = "thin"              45 s          0.268 s            23.1 MB / 105 MB
#   + lto = "fat"              125 s          0.269 s            19.2 MB / 105 MB
#   + codegen-units = 1        121 s          0.192 s            18.9 MB / 52 MB
#   + fat LTO + cgu = 1        176 s          0.193 s            18.4 MB / 86 MB
#
# The runtime-side workload (1500 CPU training steps) did not move under any
# of them (4.41-4.47 s, inside the run-to-run spread). The ONLY knob that
# changes the produced code measurably is `codegen-units = 1`: the compile+
# link path of every `nsl build`/`nsl run` gets 28% faster and the archive
# every compiled program links shrinks 20% — at 2.8x the build time. LTO on
# top of it buys nothing (same link time, 0.5 MB off `nsl`) and GROWS the
# archive 52 -> 86 MB, so `dist` deliberately does not enable it.
#
# `release` therefore keeps Cargo's defaults: it is the profile every session
# rebuilds for each A/B iteration, and 90 ms per compiled program does not
# repay 80 s per rebuild. `dist` takes the single-codegen-unit treatment for
# the binaries that are built once per tag (release.yml). Debuginfo is
# already stripped by `release` (Cargo's default since 1.77), and the
# `linker.rs` CUDA-archive probe was checked against a `dist`-built,
# cuda-featured toolchain (`nsl build` links; the 52 MB archive sits inside
# the probe's 64 MiB window).
#
# `panic` stays at "unwind" everywhere: `cfie::engine` catches a panic in
# production to release a partial device allocation, and the runtime's C-ABI
# entry points are not audited for unwind-across-FFI (roadmap C1).

# Shipped artifacts (release.yml): built once, run everywhere.
[profile.dist]
inherits = "release"
codegen-units = 1

# `release` with line tables, for perf/gdb on a binary that is otherwise the
# release configuration.
[profile.release-with-debug]
inherits = "release"
debug = 1
