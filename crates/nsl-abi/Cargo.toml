[package]
name = "nsl-abi"
description = "Source of truth for the NSL runtime C-ABI: the typed runtime-function and C-API tables the codegen declares from and the runtime asserts against, plus the wire constants and record formats both crates share."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# Intentionally dependency-free: the validator parses the codegen + runtime
# source text directly (no build-time coupling to those crates), so it can run
# as a fast, standalone gate without pulling the whole compiler into its build.
[dependencies]
