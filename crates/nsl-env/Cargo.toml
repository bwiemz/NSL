[package]
name = "nsl-env"
description = "The registry of every NSL_* environment variable the toolchain reads: name, type, default, tier and doc, with a source-scanning gate that fails on an unregistered read or a stale entry."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# Intentionally dependency-free, like nsl-abi: the registry is static data
# and the agreement gate parses the workspace's source text directly, so it
# stays a fast standalone check and `nsl env` costs the CLI nothing.
[dependencies]
