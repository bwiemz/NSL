[package]
name = "nsl-kir"
description = "NSL's kernel IR: KernelIR and KirBuilder, the KIR verifier, the PTX printer and the GPU FeatureSet. A leaf crate so the compiler and the runtime build GPU kernels on one IR."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# Intentionally dependency-free (roadmap A2 step 1): the runtime cannot depend
# on nsl-codegen, and the compiler must not depend on the runtime, so the IR
# both build kernels on sits below them both. `tests/leaf.rs` pins this.
[dependencies]
