[package]
name = "nsl-runtime"
description = "Runtime library for NeuralScript programs (tensor ops, autodiff, CUDA)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
once_cell = "1"
libloading = "0.8"
memmap2 = "0.9"
rand = "0.9"
# Direct dep on the generator `rand::rngs::StdRng` already resolves to, for
# `get_word_pos`/`set_word_pos` — the O(1) RNG snapshot/restore that makes
# training checkpoints resumable (item 8). Same version rand pulls in, so
# this adds no new crate to the build graph.
rand_chacha = "0.9"
cudarc = { version = "0.19.4", default-features = false, features = ["driver", "cublas", "cuda-version-from-build-system", "dynamic-linking"], optional = true }
safetensors = { version = "0.4" }
hf-hub = { version = "0.3", optional = true }
prost = { version = "0.13", optional = true }
half = { version = "2.4", features = ["std"] }
rustc-hash = "2"
ahash = "0.8"
regex-lite = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
# Used by tools/verify-ort-vendoring.sh to diff vendored ORT struct
# definitions against upstream headers.
bindgen = "0.69"

[features]
default = []
cuda = ["dep:cudarc"]
# P4 item 14: real NCCL collectives (requires libnccl.so at link+run time;
# point RUSTFLAGS -L / LD_LIBRARY_PATH at it when not system-installed).
nccl = ["cuda", "cudarc/nccl-02030"]
interop = ["dep:hf-hub", "dep:prost", "dep:regex-lite"]
test-hooks = []
# M62b Spec C — ONNX Runtime custom op integration. Off by default.
# When enabled, the .so/.dll exports RegisterCustomOps so ONNX Runtime
# can load it via SessionOptions::register_custom_ops_library.
# Vendored against ORT 1.22.x (ORT_API_VERSION=22).
onnx-rt-op = []
# Opt-in feature for internal-only benchmark/test surfaces that touch the
# `assert_tier_b_sentinels` discipline (planner spec §8.5). The associated
# tests are #![cfg(feature = "bench-internal")]-gated so they don't run in
# normal `cargo test` invocations.
bench-internal = []
# Force cuBLAS to `CUBLAS_PEDANTIC_MATH` (strict f32) instead of the default,
# which is `CUBLAS_TF32_TENSOR_OP_MATH`. Per spec
# 2026-04-21-matmul-cublas-swap-design §9 this is the compile-time opt-out for
# workloads that require strict f32 summation bounds; `NSL_MATMUL_TF32=0` is
# the runtime equivalent. `NSL_MATMUL_PEDANTIC=1` takes precedence over both.
#
# This comment previously said the alternative was `CUBLAS_DEFAULT_MATH`,
# "which enables TF32 tensor cores on sm_80+". That was false — it does not
# enable TF32 for `cublasSgemm` — and it is the same claim the startup banner
# carried until item 9 corrected it. TF32 is the default now because it was
# measured and chosen, not because the constant's name suggested it.
strict-matmul = []
# CSHA cycle 19 T1: probe FFI that adds trailing probe_ds_out_ptr / probe_dv_out_ptr
# slots to `nsl_flash_attention_csha_backward_probe` (variant-B new symbol; the
# 54-param original is untouched). Default OFF; the feature is enabled only by
# c19 probe test invocations and never in production builds. See project memory
# `project_csha_paper_completion_cycle18.md` DEGENERATE-PROBE meta-lesson.
csha_cycle19_probe = []
