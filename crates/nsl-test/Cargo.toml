[package]
name = "nsl-test"
description = "Test utilities for NeuralScript kernel verification"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# CSHA backward-kernel diagnostic mode (origin/main)
half = { version = "2.4", features = ["std"] }
# FlashAttention configs the CPU-naive references and the B1 adapter take.
nsl-codegen.workspace = true
# Phase 2.6 B1Forward GPU launcher (cuda-gated): FFIs nsl_cuda_init /
# nsl_test_cuda_* + nsl_kernel_launch. nsl-runtime is not in
# [workspace.dependencies], so reference it by path. Optional + cuda-gated so
# the default build stays CUDA-free.
nsl-runtime = { path = "../nsl-runtime", optional = true }

[features]
default = []
cuda = ["dep:nsl-runtime", "nsl-runtime/cuda"]
