# Standalone (not a member of the NSL workspace) so that iterating on tokenizer
# designs does not force a rebuild of the compiler.
[workspace]

[package]
name = "tokbench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
ahash = "0.8"
# Depend on the shipped trainer rather than forking it, so the numbers this
# benchmark reports come from the code that actually runs.
nsl-runtime = { path = "../../crates/nsl-runtime", default-features = false }

[profile.release]
opt-level = 3
